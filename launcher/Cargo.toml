[package]
name = "rrbtd6-launcher"
description = "Installs, updates and starts rrbtd6: game build from GitHub releases, data from your own BTD6 install"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"


# The setup window on macOS and Linux (Windows draws its own with Win32): the same macroquad the game
# uses, without audio.
[target.'cfg(not(windows))'.dependencies]
macroquad = { version = "0.4", default-features = false }
# Checking downloads (Windows uses its own BCrypt).
sha2 = "0.10"
