<!doctype html>
<!-- Source of public/social.png, the link preview image. Regenerate with tools/site_social_card.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>RustTD6 social card</title>
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 70px 90px; display: flex; flex-direction: column; justify-content: center; background: #2f80f5; color: #fff; }
  .row { display: flex; align-items: center; gap: 22px; margin-bottom: 40px; }
  .row img { width: 92px; height: 92px; }
  .row .brand { font-size: 52px; }
  .card h1 { margin: 0 0 30px; font-size: 92px; line-height: 1.05; }
  .card p { margin: 0; font-size: 34px; opacity: .95; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><img src="/logo.png" alt=""><span class="brand">RustTD6</span></div>
  <h1>Built to<br>Go Further.</h1>
  <p>Free and fan-made. Co-op, mods and everything unlocked.</p>
</div>
</body>
</html>
