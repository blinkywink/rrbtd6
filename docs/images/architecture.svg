<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <title id="t">How RustTD6 is put together</title>
  <desc id="d">The installer mod and launcher set up a local copy. The setup tools read the player's own BTD6 install and write local game data. The Rust game loads that data, with co-op and mods on top.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b6b82"/></marker>
  </defs>
  <rect width="960" height="330" rx="16" fill="#f5f8fd"/>
  <g font-size="12" fill="#5b6b82" font-weight="600" letter-spacing=".06em">
    <text x="40" y="38">YOUR PC</text>
    <text x="280" y="38">SETUP (ONCE, AND AFTER BTD6 UPDATES)</text>
    <text x="680" y="38">EVERY TIME YOU PLAY</text>
  </g>
  <g fill="#fff" stroke="#c9d6e8" stroke-width="1.5">
    <rect x="40" y="54" width="190" height="104" rx="12"/>
    <rect x="40" y="186" width="190" height="104" rx="12"/>
    <rect x="280" y="54" width="170" height="236" rx="12"/>
    <rect x="490" y="120" width="140" height="104" rx="12"/>
  </g>
  <rect x="680" y="54" width="240" height="236" rx="12" fill="#2f80f5"/>
  <g fill="#14233b">
    <text x="58" y="84" font-size="16" font-weight="700">Your BTD6 install</text>
    <text x="58" y="108" font-size="13" fill="#46566c">Art, audio, maps and</text>
    <text x="58" y="126" font-size="13" fill="#46566c">stats. Read only, never</text>
    <text x="58" y="144" font-size="13" fill="#46566c">changed.</text>
    <text x="58" y="216" font-size="16" font-weight="700">Installer and launcher</text>
    <text x="58" y="240" font-size="13" fill="#46566c">installer_mod/, launcher/</text>
    <text x="58" y="258" font-size="13" fill="#46566c">Installs, updates and</text>
    <text x="58" y="276" font-size="13" fill="#46566c">starts everything.</text>
    <text x="298" y="84" font-size="16" font-weight="700">Extraction</text>
    <text x="298" y="108" font-size="13" fill="#46566c">tools/extract_all.py</text>
    <text x="298" y="140" font-size="13" fill="#46566c">Models and clips</text>
    <text x="298" y="162" font-size="13" fill="#46566c">Maps and mechanics</text>
    <text x="298" y="184" font-size="13" fill="#46566c">Audio and effects</text>
    <text x="298" y="206" font-size="13" fill="#46566c">UI and sprites</text>
    <text x="298" y="228" font-size="13" fill="#46566c">Tower and bloon data</text>
    <text x="298" y="268" font-size="12" fill="#5b6b82">Runs on your PC only</text>
    <text x="508" y="150" font-size="16" font-weight="700">Local data</text>
    <text x="508" y="174" font-size="13" fill="#46566c">local_extracted/</text>
    <text x="508" y="196" font-size="12" fill="#5b6b82">Never committed</text>
  </g>
  <g fill="#fff">
    <text x="698" y="84" font-size="16" font-weight="700">The game (Rust)</text>
    <text x="698" y="120" font-size="14" font-weight="600">renderer/</text>
    <text x="698" y="140" font-size="13" opacity=".92">Simulation, graphics, menus</text>
    <text x="698" y="176" font-size="14" font-weight="600">coop/</text>
    <text x="698" y="196" font-size="13" opacity=".92">Encrypted peer-to-peer rooms</text>
    <text x="698" y="232" font-size="14" font-weight="600">mods/</text>
    <text x="698" y="252" font-size="13" opacity=".92">Your mods, loaded from files</text>
  </g>
  <g fill="none" stroke="#5b6b82" stroke-width="2" marker-end="url(#a)">
    <path d="M230 106H278"/>
    <path d="M230 238H278"/>
    <path d="M450 172H488"/>
    <path d="M630 172H678"/>
  </g>
</svg>
