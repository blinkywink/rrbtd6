[package]
name = "btd6-game"
description = "Playable local prototype: real BTD6 data and art loaded from the user's own install"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
macroquad = { version = "0.4" }
quad-snd = "0.2.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rrbtd6-coop = { path = "../coop" }
blake3 = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = { version = "0.13.3", default-features = false }
# MP3s in the jukebox's custom music folder (quad-snd's decoder has WAV, FLAC and Ogg only).
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }


rhai = { version = "1.23", features = ["sync", "serde", "no_time"] }

# The sim makes and drops many small objects per pop (bloons, their effect lists); mimalloc's
# thread-local free lists are much faster at that than the Windows heap.
[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false }
