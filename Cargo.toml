[workspace]
resolver = "3"
members = ["engine", "tests", "benchmarks", "renderer", "coop", "launcher"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.bench]
inherits = "release"

# Fast rebuilds for the playable prototype (`cargo game`): release speed, no LTO, parallel codegen.
[profile.game]
inherits = "release"
debug = 0
lto = false
codegen-units = 16
incremental = true

# Shipped builds (tools/build_exe.sh, build_macos.sh, build_ios.sh): the game profile's results,
# whole-program optimized (fat LTO, one codegen unit). Slower to build, faster to run; the same
# floating-point results (Rust never reorders float math).
[profile.dist]
inherits = "release"
debug = 0
lto = "fat"
codegen-units = 1
incremental = false

# miniquad with independent depth test / depth write (see vendor/miniquad/src/graphics/gl.rs).
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
macroquad = { path = "vendor/macroquad" }

quad-snd = { path = "vendor/quad-snd" }

# Builds for iOS (see the file's RustTD6 comment).
netdev = { path = "vendor/netdev" }
netwatch = { path = "vendor/netwatch" }
