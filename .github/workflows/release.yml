# Every push to main (tools/publish.sh) builds the Windows game and publishes it as the latest
# release. The launcher/installer reads releases/latest to update. Code only: the game data is
# extracted on each player's PC from their own BTD6 install.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: game

      - name: Build game
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build -p btd6-game --release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/btd6-game.exe dist/rrbtd6.exe
          tar -a -c -f dist/rrbtd6-tools.zip tools/assets tools/il2cpp tools/sim_model tools/dotnet_meta tools/build_local_assets.sh
          printf '{"build":%s,"commit":"%s"}\n' "${{ github.run_number }}" "${{ github.sha }}" > dist/version.json

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" dist/rrbtd6.exe dist/rrbtd6-tools.zip dist/version.json \
            --title "Build ${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}. Game data is not included; it is extracted from your own BTD6 install." \
            --latest
