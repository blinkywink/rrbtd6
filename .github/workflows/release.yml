# Every push to main (tools/publish.sh) tests and builds the Windows game, the launcher and the
# BTD6 installer mod, and builds the macOS and Linux game and launcher. A release is published only
# when VERSION names a version that has none yet
# (tag v<VERSION>, title "Version <VERSION>"); then every older release goes, so the releases page
# holds the current version alone (plus the prepared Python runtime). The launcher and the mod read
# releases/latest to install and update; version.json's "build" (the run number) keeps rising for
# launchers that compare it. Code only: the game data is extracted on each player's PC from their
# own BTD6 install.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The embeddable Python the launcher sets up (launcher/src/main.rs PYTHON_VERSION; checked below).
  PYTHON_EMBED: "3.13.1"

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      runtime: ${{ steps.runtime.outputs.tag }}
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: game

      - name: Version
        id: version
        shell: bash
        run: |
          version="$(tr -d ' \r\n' < VERSION)"
          if ! [[ "$version" =~ ^0\.[0-9]+$ || "$version" =~ ^[1-9][0-9]*\.[0-9]+$ ]]; then
            echo "VERSION must be a number like 0.651, not '$version'"; exit 1
          fi
          grep -q "const PYTHON_VERSION: &str = \"$PYTHON_EMBED\";" launcher/src/main.rs \
            || { echo "PYTHON_EMBED ($PYTHON_EMBED) differs from the launcher's PYTHON_VERSION"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Version $version is already released: test and build only."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "Version $version will be released."
          fi

      - name: Install storage test dependencies
        shell: bash
        run: python -m pip install soundfile==0.13.1 numpy==2.5.4 zstandard==0.25.0

      - name: Test tooling and updater
        shell: bash
        run: |
          python -I tools/tests/test_modsdk.py
          python -I tools/tests/test_mod_model.py
          python -I tools/tests/test_extraction_bootstrap.py
          python -I tools/tests/test_package_tools.py
          python -I tools/tests/test_shader_imports.py
          python -I tools/tests/test_extraction_plan.py
          python -I tools/tests/test_setup_progress.py
          python -I tools/tests/test_animation_precompute.py
          python -I tools/tests/test_clip_sampling.py
          python -I tools/tests/test_model_refs.py
          python -I tools/tests/test_shared_textures.py
          python -I tools/tests/test_repack_anims.py
          python -I tools/tests/test_link_duplicates.py
          cargo test --release -p rrbtd6-launcher --locked
          cargo test --release -p btd6-game --locked mod_entities::
          cargo test --release -p btd6-game --locked mod_runtime::tests
          cargo test --release -p rrbtd6-coop --locked
          cargo test --release -p btd6-game modding:: --locked
          cargo test --release -p btd6-game frontend::mod_browser:: --locked
          cargo test --release -p btd6-game platform:: --locked

      - name: Build game and launcher
        shell: bash
        run: cargo build -p btd6-game -p rrbtd6-launcher --release

      - name: Test lossless storage
        shell: bash
        run: |
          python -I tools/tests/test_word_anims.py
          python -I tools/tests/test_compact_json.py
          cargo test --release -p btd6-game animation_storage:: --locked
          python -I tools/tests/test_audio_storage.py
          python -I tools/tests/test_audio_storage.py --fixtures target/audio-fixtures
          RRBTD6_AUDIO_FIXTURES=target/audio-fixtures cargo test --release -p btd6-game lossless_mixer_equivalence --locked -- --ignored
          cargo test --release -p quad-snd prepared_tests --locked

      # Downloads Python and PyPI packages, so only for a build that will be released.
      - name: Test embedded Python bootstrap
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: python -I tools/tests/test_launcher_bootstrap.py target/release/rrbtd6-launcher.exe

      - name: Build installer mod
        shell: bash
        run: |
          # MelonLoader (Apache-2.0) only for its reference assembly; nothing from BTD6 is needed.
          curl --fail --location --retry 3 -o ml.zip https://github.com/LavaGang/MelonLoader/releases/download/v0.7.3/MelonLoader.x64.zip
          python -m zipfile -e ml.zip ml
          dotnet build installer_mod/RRBTD6Installer.csproj -c Release -p:MelonLoaderDir="$PWD/ml" -o installer_out

      - name: Package
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/btd6-game.exe dist/rrbtd6.exe
          cp target/release/rrbtd6-launcher.exe dist/rrbtd6-launcher.exe
          # The same program under the name players download: run it and it installs itself.
          cp target/release/rrbtd6-launcher.exe dist/RustTD6Setup.exe
          cp installer_out/RRBTD6Installer.dll dist/RRBTD6Installer.dll
          python -I tools/package_tools.py dist/rrbtd6-tools.zip
          python -I tools/extract_all.py --asset-revision > dist/assets_revision.txt

      - name: Upload Windows files
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

      # The launcher's first-run Python with the extraction packages already installed (one GitHub
      # download for players instead of python.org + PyPI). Its tag is keyed by the requirements and
      # the Python version (launcher runtime_tag), so it is only built when those change.
      - name: Prepared Python runtime
        id: runtime
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          key="$(python -I -c "import hashlib; print(hashlib.sha256((open('tools/requirements.txt', encoding='utf-8', newline='').read() + '$PYTHON_EMBED').encode()).hexdigest()[:16])")"
          tag="python-runtime-$key"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "$tag exists"; exit 0; fi
          curl --fail --location --retry 3 -o py.zip "https://www.python.org/ftp/python/$PYTHON_EMBED/python-$PYTHON_EMBED-embed-amd64.zip"
          python -m zipfile -e py.zip py
          for pth in py/*._pth; do sed -i 's/^#import site/import site/' "$pth"; done
          curl --fail --location --retry 3 -o get-pip.py https://bootstrap.pypa.io/get-pip.py
          py/python.exe get-pip.py --no-warn-script-location
          py/python.exe -m pip install --no-warn-script-location setuptools==80.9.0 wheel==0.45.1
          py/python.exe -m pip install --no-warn-script-location --no-build-isolation -r tools/requirements.txt
          cp tools/requirements.txt py/requirements.installed
          py/python.exe -X utf8 -I -c "import ssl, zipfile, UnityPy, numpy, PIL"
          python -I -c "
          import os, zipfile
          with zipfile.ZipFile('rrbtd6-python.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for d, _, files in os.walk('py'):
                  for f in files:
                      p = os.path.join(d, f)
                      z.write(p, os.path.relpath(p, 'py'))
          "
          gh release create "$tag" rrbtd6-python.zip -R "$GITHUB_REPOSITORY" --title "Python runtime $key" \
            --notes "The launcher's first-run Python $PYTHON_EMBED with tools/requirements.txt installed. Not a game release." --latest=false

  # The macOS game and launcher (Apple Silicon), and RustTD6.app: the launcher as an app players drag
  # into Applications. It installs to ~/Library/Application Support/RustTD6 and updates from there.
  macos:
    needs: windows
    if: needs.windows.outputs.publish == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: game-macos
      - name: Build game and launcher
        run: cargo build -p btd6-game -p rrbtd6-launcher --release
      - name: Test launcher Python setup
        run: python3 -I tools/tests/test_launcher_bootstrap.py target/release/rrbtd6-launcher
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/btd6-game dist/rrbtd6-macos
          cp target/release/rrbtd6-launcher dist/rrbtd6-launcher-macos
          app=RustTD6.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/rrbtd6-launcher "$app/Contents/MacOS/RustTD6"
          set_dir=RustTD6.iconset; mkdir -p "$set_dir"
          for s in 16 32 128 256 512; do
            sips -z $s $s renderer/assets/icon/icon.png --out "$set_dir/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); sips -z $d $d renderer/assets/icon/icon.png --out "$set_dir/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set_dir" -o "$app/Contents/Resources/RustTD6.icns"
          version="$(tr -d ' \r\n' < VERSION)"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>RustTD6</string>
            <key>CFBundleDisplayName</key><string>RustTD6</string>
            <key>CFBundleIdentifier</key><string>com.rusttd6.launcher</string>
            <key>CFBundleExecutable</key><string>RustTD6</string>
            <key>CFBundleIconFile</key><string>RustTD6</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          sed -i '' 's/^          //' "$app/Contents/Info.plist"
          codesign --force --deep -s - "$app"
          ditto -c -k --keepParent "$app" dist/RustTD6-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  # The Linux game and launcher (x86-64; built on an older Ubuntu so they run on older systems too),
  # and RustTD6-linux.tar.gz: the launcher, ready to run, which installs to ~/.local/share/RustTD6.
  linux:
    needs: windows
    if: needs.windows.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: game-linux
      - name: Libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Build game and launcher
        run: cargo build -p btd6-game -p rrbtd6-launcher --release
      - name: Test launcher Python setup
        run: python3 -I tools/tests/test_launcher_bootstrap.py target/release/rrbtd6-launcher
      - name: Package
        run: |
          mkdir -p dist pack
          cp target/release/btd6-game dist/rrbtd6-linux
          cp target/release/rrbtd6-launcher dist/rrbtd6-launcher-linux
          cp target/release/rrbtd6-launcher pack/RustTD6
          chmod +x pack/RustTD6
          tar -czf dist/RustTD6-linux.tar.gz -C pack RustTD6
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  # The release: every system's files and one version.json listing each file's SHA-256. A system
  # whose build failed is left out rather than holding up the others.
  publish:
    needs: [windows, macos, linux]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.windows.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Version file
        run: |
          mkdir -p dist
          for system in windows macos linux; do
            [ -d "artifacts/$system" ] && cp artifacts/$system/* dist/ || echo "no $system files"
          done
          revision="$(tr -d ' \r\n' < dist/assets_revision.txt)"; rm dist/assets_revision.txt
          python3 - "$revision" <<'PY'
          import hashlib, json, os, sys
          names = ["rrbtd6.exe", "rrbtd6-launcher.exe", "rrbtd6-tools.zip", "rrbtd6-macos", "rrbtd6-launcher-macos",
                   "rrbtd6-linux", "rrbtd6-launcher-linux"]
          sha = {n: hashlib.sha256(open(os.path.join("dist", n), "rb").read()).hexdigest() for n in names if os.path.exists(os.path.join("dist", n))}
          info = {"build": int(os.environ["RUN"]), "version": os.environ["VERSION"], "commit": os.environ["COMMIT"],
                  "assets_revision": sys.argv[1], "sha256": sha}
          open("dist/version.json", "w").write(json.dumps(info) + "\n")
          print(json.dumps(info, indent=1))
          PY
        env:
          RUN: ${{ github.run_number }}
          VERSION: ${{ needs.windows.outputs.version }}
          COMMIT: ${{ github.sha }}

      - name: Publish release
        run: |
          version="${{ needs.windows.outputs.version }}"
          notes="RustTD6 version $version (${{ github.sha }}).

          Windows: download RustTD6Setup.exe and run it. It finds BTD6, installs itself and sets everything up.
          macOS: unzip RustTD6-macOS.zip and drag RustTD6 into Applications.
          Linux: unpack RustTD6-linux.tar.gz and run RustTD6.
          Game data is not included; it is extracted from your own BTD6 install."
          gh release create "v$version" dist/* -R "$GITHUB_REPOSITORY" --title "Version $version" --notes "$notes" --latest

      # Only the current version (and the current Python runtime) stay on the releases page.
      - name: Remove older releases
        run: |
          keep_version="v${{ needs.windows.outputs.version }}"
          keep_runtime="${{ needs.windows.outputs.runtime }}"
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" = "$keep_version" ] || [ "$tag" = "$keep_runtime" ]; then continue; fi
            echo "deleting $tag"
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "could not delete $tag"
          done
