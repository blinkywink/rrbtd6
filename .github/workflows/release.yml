# Every push to main (tools/publish.sh) builds the Windows game, the launcher and the BTD6
# installer mod, and publishes them as the latest release. The launcher and the mod read
# releases/latest to install and update. Code only: the game data is extracted on each player's
# PC from their own BTD6 install.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: game

      - name: Test tooling and updater
        shell: bash
        run: |
          python -I tools/test_modsdk.py
          python -I tools/test_extraction_bootstrap.py
          python -I tools/test_package_tools.py
          python -I tools/test_shader_imports.py
          python -I tools/test_extraction_plan.py
          python -I tools/test_model_refs.py
          python -I tools/test_shared_textures.py
          python -I tools/test_repack_anims.py
          python -I tools/test_link_duplicates.py
          cargo test --release -p rrbtd6-launcher --locked
          cargo test --release -p rrbtd6-coop --locked
          cargo test --release -p btd6-game modding:: --locked
          cargo test --release -p btd6-game frontend::mod_browser:: --locked

      - name: Build game and launcher
        shell: bash
        run: cargo build -p btd6-game -p rrbtd6-launcher --release

      - name: Test lossless storage
        shell: bash
        run: |
          python -m pip install soundfile==0.13.1 numpy==2.5.4 zstandard==0.25.0
          python -I tools/test_word_anims.py
          python -I tools/test_compact_json.py
          cargo test --release -p btd6-game animation_storage:: --locked
          python -I tools/test_audio_storage.py
          python -I tools/test_audio_storage.py --fixtures target/audio-fixtures
          RRBTD6_AUDIO_FIXTURES=target/audio-fixtures cargo test --release -p btd6-game lossless_mixer_equivalence --locked -- --ignored
          cargo test --release -p quad-snd prepared_tests --locked

      - name: Test embedded Python bootstrap
        shell: bash
        run: python -I tools/test_launcher_bootstrap.py target/release/rrbtd6-launcher.exe

      - name: Build installer mod
        shell: bash
        run: |
          # MelonLoader (Apache-2.0) only for its reference assembly; nothing from BTD6 is needed.
          curl --fail --location --retry 3 -o ml.zip https://github.com/LavaGang/MelonLoader/releases/download/v0.7.3/MelonLoader.x64.zip
          python -m zipfile -e ml.zip ml
          dotnet build installer_mod/RRBTD6Installer.csproj -c Release -p:MelonLoaderDir="$PWD/ml" -o installer_out

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/btd6-game.exe dist/rrbtd6.exe
          cp target/release/rrbtd6-launcher.exe dist/rrbtd6-launcher.exe
          cp installer_out/RRBTD6Installer.dll dist/RRBTD6Installer.dll
          python -I tools/package_tools.py dist/rrbtd6-tools.zip
          revision="$(python -I tools/extract_all.py --asset-revision)"
          printf '{"build":%s,"commit":"%s","assets_revision":"%s"}\n' "${{ github.run_number }}" "${{ github.sha }}" "$revision" > dist/version.json

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          notes="Automatic build of ${{ github.sha }}.

          Install: put RRBTD6Installer.dll in your BTD6 Mods folder (MelonLoader 0.7.3) and start BTD6.
          Game data is not included; it is extracted from your own BTD6 install."
          gh release create "$tag" dist/rrbtd6.exe dist/rrbtd6-launcher.exe dist/RRBTD6Installer.dll \
            dist/rrbtd6-tools.zip dist/version.json --title "Build ${{ github.run_number }}" --notes "$notes" --latest
